{
  "name": "Bug report",
  "description": "Report a reproducible problem with X4D.",
  "title": "[Bug]: ",
  "labels": [
    "bug"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "For installation questions or uncertain behavior, please use [Q&A](https://github.com/mmheart21-del/x4d-workflow-kit-for-blender/discussions/categories/q-a). Search existing reports before submitting."
      }
    },
    {
      "type": "input",
      "id": "x4d_version",
      "attributes": {
        "label": "X4D version",
        "placeholder": "Example: 0.6.1"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "blender_version",
      "attributes": {
        "label": "Blender version",
        "placeholder": "Example: 5.2.3 LTS"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "operating_system",
      "attributes": {
        "label": "Operating system",
        "placeholder": "Example: Windows 11"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "steps",
      "attributes": {
        "label": "Steps to reproduce",
        "placeholder": "1. Start with a new file\n2. Create...\n3. Click..."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected",
      "attributes": {
        "label": "Expected result"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "actual",
      "attributes": {
        "label": "Actual result"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Error output, screenshots or a minimal test file",
        "description": "Paste the full traceback if available. Attach screenshots or a small example scene that you can share."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
