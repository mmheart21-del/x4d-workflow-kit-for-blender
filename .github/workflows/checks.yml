name: Source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q x4d_workflow scripts tests
      - run: python scripts/build_icons.py
      - run: git diff --exit-code -- x4d_workflow/assets/icons
